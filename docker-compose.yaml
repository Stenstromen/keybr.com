services:
  keybr:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "30044:3000"
    environment:
      APP_URL: http://localhost:30044/
      COOKIE_DOMAIN: localhost
      COOKIE_SECURE: "false"
    volumes:
      - keybr-data:/var/lib/keybr
    restart: unless-stopped

volumes:
  keybr-data:
